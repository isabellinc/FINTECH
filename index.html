<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CASHUP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./dist/CSS/styles.css">
</head>
<body>

    <div class="bg-gradient-principal min-h-screen flex max-md:flex-col">

        <aside class="logo-aside">
            <div class="font-title text-center">
                <h1 class="text-4xl font-black text-logo">CASHUP</h1>
                <h4 class="font-semibold text-sm text-logo mb-6">Controle Financeiro</h4>
            </div>
            <button class="button-signup">Cadastrar</button>
        </aside>

        <main class="text-container">
            <div class="flex flex-col gap-3 items-center justify-center">
                <h1 class="text-3xl font-medium max-md:mb-1">Faça seu login</h1>
                <p class="text-lg text-muted-foreground mb-3 max-md:mb-5">Preencha seus dados</p>
            </div>

            <form name="form-cadastro" id="form-cadastro" method="post" action="">
                <div class="input-container">
                    <img src="./dist/images/e-mail.png" alt="ícone email">
                    <input class="outline-none" type="email" name="email-usuario" id="email-usuario" required placeholder="E-mail" autocomplete="email">
                </div>

                <div class="input-container">
                    <img src="./dist/images/cadeado.png" alt="ícone cadeado">
                    <input class="outline-none" type="password" name="senha-usuario" id="senha-usuario" required placeholder="Senha">
                </div>

                <div>
                    <button class="button-login">Entrar</button>
                    <a class="flex flex-col items-center justify-center mt-5" href="">Esqueci minha senha</a>
                </div>
            </form>
        </main>

    </div>

</body>
</html>
